# OA 前端站点配置：同源路径反代到 compose 网络内的服务。
#   /api/  -> openim-server 10002
#   /chat/ -> openim-chat   10008
#   /complete_admin/ -> openim-chat 10009
#   /msg_gateway -> openim-server 10001 (WebSocket)
#   /oss/  -> minio         9000
#   /oa/   -> xinbo-oa      10010 (OA 打卡/日报/请假等)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml application/wasm;
    gzip_vary on;

    # 带指纹的静态资源长缓存
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /openIM.wasm {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /custom/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 入口 HTML / SPA 回落不缓存，发版即生效
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location ^~ /api/ {
        proxy_pass http://openim-server:10002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /chat/ {
        proxy_pass http://openim-chat:10008/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /complete_admin/ {
        proxy_pass http://openim-chat:10009/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /msg_gateway {
        proxy_pass http://openim-server:10001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /oss/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 100m;
    }

    # OA 业务服务。注意 proxy_pass 不能带结尾斜杠，否则 /oa 前缀被剥掉，后端只认 /oa/api/v1/*
    location ^~ /oa/ {
        proxy_pass http://xinbo-oa:10010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 30m;
    }
}
