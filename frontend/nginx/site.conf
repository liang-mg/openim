# OA 前端站点配置：同源路径反代到 compose 网络内的服务。
#   /api/  -> openim-server 10002
#   /chat/ -> openim-chat   10008
#   /complete_admin/ -> openim-chat 10009
#   /msg_gateway -> openim-server 10001 (WebSocket)
#   /oss/  -> minio         9000
#   /oa/   -> xinbo-oa      10010 (OA 打卡/日报/请假等)
#   /livekit -> livekit      7880 (WebRTC 信令 WebSocket，前缀需剥掉，后端只认根路径 /)
#
# 重要：所有 upstream 一律用 resolver + 变量「动态解析」。
#   - Docker 内嵌 DNS 固定为 127.0.0.11；服务名在「请求到达时」才解析。
#   - 这样任一上游容器未启动 / 重启后换 IP，nginx 仍能正常启动、页面仍能打开，
#     只有对应接口返回 502，不再出现 host not found in upstream 导致整站反复重启。
#   - rewrite break 保留原有「剥掉 /api 等前缀」语义，与静态 proxy_pass 行为一致。

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml application/wasm;
    gzip_vary on;

    # 带指纹的静态资源长缓存
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /openIM.wasm {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /custom/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 入口 HTML / SPA 回落不缓存，发版即生效
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # 注意：set 必须在 rewrite ... break 之前。rewrite break 会终止后续
    # rewrite 模块指令，若 set 在其后会被跳过，导致变量空、proxy_pass 500。
    location ^~ /api/ {
        set $im_api http://openim-server:10002;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $im_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /chat/ {
        set $im_chat http://openim-chat:10008;
        rewrite ^/chat/(.*)$ /$1 break;
        proxy_pass $im_chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /complete_admin/ {
        set $im_admin http://openim-chat:10009;
        rewrite ^/complete_admin/(.*)$ /$1 break;
        proxy_pass $im_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /msg_gateway {
        set $im_ws http://openim-server:10001;
        proxy_pass $im_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # LiveKit WebRTC 信令（WebSocket）。前端 Web 模式连同源 /livekit，
    # 但 LiveKit 服务端只认根路径 /，故必须 rewrite 剥掉 /livekit 前缀。
    # set 必须在 rewrite break 之前，否则变量被跳过导致 500。
    location ^~ /livekit {
        set $im_livekit http://livekit:7880;
        rewrite ^/livekit/?(.*)$ /$1 break;
        proxy_pass $im_livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /oss/ {
        set $im_oss http://minio:9000;
        rewrite ^/oss/(.*)$ /$1 break;
        proxy_pass $im_oss;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 100m;
    }

    # OA 业务服务。保留 /oa 前缀（后端只认 /oa/api/v1/*），故不做 rewrite。
    location ^~ /oa/ {
        set $oa_backend http://xinbo-oa:10010;
        proxy_pass $oa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 30m;
    }
}
