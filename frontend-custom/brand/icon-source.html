<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; }
  .icon {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1677ff 0%, #3f9bff 55%, #63b8ff 100%);
    border-radius: 22%;
    position: relative;
    overflow: hidden;
  }
  .icon::after {
    content: "";
    position: absolute;
    left: -30%; top: -60%;
    width: 90%; height: 120%;
    background: radial-gradient(closest-side, rgba(255,255,255,.28), rgba(255,255,255,0));
    transform: rotate(18deg);
  }
  .word {
    position: relative;
    color: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Source Han Sans SC", sans-serif;
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1;
    /* 字号用 vw 保证任意画布都按比例缩放 */
    font-size: 33vw;
    text-shadow: 0 2px 10px rgba(0, 40, 100, .18);
    padding-left: 0.06em;
  }
  .word.small { font-size: 27vw; }
</style>
</head>
<body>
  <div class="icon"><div class="word" id="w">新博</div></div>
</body>
</html>
