networks:
  openim:
    driver: bridge

services:
  mongo:
    image: "${MONGO_IMAGE}"
    container_name: mongo
    command: >
      bash -c '
      docker-entrypoint.sh mongod --wiredTigerCacheSizeGB $$wiredTigerCacheSizeGB --auth &
      until mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "db.runCommand({ ping: 1 })" &>/dev/null; do
        echo "Waiting for MongoDB to start..."
        sleep 1
      done &&
      mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "
      db = db.getSiblingDB(\"$$MONGO_INITDB_DATABASE\");
      if (!db.getUser(\"$$MONGO_OPENIM_USERNAME\")) {
        db.createUser({
          user: \"$$MONGO_OPENIM_USERNAME\",
          pwd: \"$$MONGO_OPENIM_PASSWORD\",
          roles: [{role: \"readWrite\", db: \"$$MONGO_INITDB_DATABASE\"}]
        });
        print(\"User created successfully: \");
        print(\"Username: $$MONGO_OPENIM_USERNAME\");
        print(\"Password: $$MONGO_OPENIM_PASSWORD\");
        print(\"Database: $$MONGO_INITDB_DATABASE\");
      } else {
        print(\"User already exists in database: $$MONGO_INITDB_DATABASE, Username: $$MONGO_OPENIM_USERNAME\");
      }
      " &&
      tail -f /dev/null
      '
    volumes:
      - "${DATA_DIR}/components/mongodb/data/db:/data/db"
      - "${DATA_DIR}/components/mongodb/data/logs:/data/logs"
      - "${DATA_DIR}/components/mongodb/data/conf:/etc/mongo"
    environment:
      - TZ=Asia/Shanghai
      - wiredTigerCacheSizeGB=1
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?请在 .env 设置 MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=openim_v3
      - MONGO_OPENIM_USERNAME=${MONGO_USERNAME}
      - MONGO_OPENIM_PASSWORD=${MONGO_PASSWORD}
    restart: always
    networks:
      - openim

  redis:
    image: "${REDIS_IMAGE}"
    container_name: redis
    volumes:
      - "${DATA_DIR}/components/redis/data:/data"
      - "${DATA_DIR}/components/redis/config/redis.conf:/usr/local/redis/config/redis.conf"
    environment:
      TZ: Asia/Shanghai
    restart: always
    sysctls:
      net.core.somaxconn: 1024
    command:
      [
        "redis-server",
        "/usr/local/redis/config/redis.conf",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    networks:
      - openim

  etcd:
    image: "${ETCD_IMAGE}"
    container_name: etcd
    user: root
    ports:
      - "127.0.0.1:12379:2379"
      - "127.0.0.1:12380:2380"
    environment:
      - ETCD_NAME=s1
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER=s1=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=tkn
      - ETCD_INITIAL_CLUSTER_STATE=new
      # Authentication is managed below; no-auth requires a trusted, isolated network.
      - ALLOW_NONE_AUTHENTICATION=yes

      ## Optional: Enable etcd authentication by setting the following credentials
      # - ETCD_ROOT_USER=root
      # - ETCD_ROOT_PASSWORD=<CHANGE_ME_FROM_ENV>
      # - ETCD_USERNAME=openIM
      # - ETCD_PASSWORD=<CHANGE_ME_FROM_ENV>
    volumes:
      - "${DATA_DIR}/components/etcd:/etcd-data"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        fail() { echo "$$*" >&2; exit 1; }
        auth=no
        if [ -n "$${ETCD_ROOT_USER:-}$${ETCD_ROOT_PASSWORD:-}$${ETCD_USERNAME:-}$${ETCD_PASSWORD:-}" ]; then
          [ -n "$${ETCD_ROOT_USER:-}" ] && [ -n "$${ETCD_ROOT_PASSWORD:-}" ] && [ -n "$${ETCD_USERNAME:-}" ] && [ -n "$${ETCD_PASSWORD:-}" ] || fail "Set all four authentication variables or leave all four empty."
          [ "$$ETCD_ROOT_USER" = root ] && [ "$$ETCD_USERNAME" != root ] || fail "etcd requires ETCD_ROOT_USER=root and a separate application user."
          auth=yes
        fi
        [ -d /etcd-data ] && [ -w /etcd-data ] && [ -x /etcd-data ] || fail "/etcd-data must be writable and searchable."
        (unset ETCD_ROOT_USER ETCD_ROOT_PASSWORD ETCD_USERNAME ETCD_PASSWORD; ETCD_DATA_DIR=/etcd-data exec etcd) &
        daemon=$$!
        cleanup() {
          trap - EXIT TERM INT
          kill -"$${signal:-TERM}" "$$daemon" 2>/dev/null || :
          wait "$$daemon" 2>/dev/null || :
        }
        trap cleanup EXIT
        trap "signal=TERM; exit 143" TERM
        trap "signal=INT; exit 130" INT
        export ETCDCTL_API=3 ETCDCTL_ENDPOINTS=http://127.0.0.1:2379
        export ETCDCTL_DIAL_TIMEOUT=2s ETCDCTL_COMMAND_TIMEOUT=2s
        unset ETCDCTL_USER ETCDCTL_PASSWORD
        attempts=0
        until etcdctl endpoint status >/dev/null 2>&1; do
          kill -0 "$$daemon" 2>/dev/null || { wait "$$daemon"; exit $$?; }
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 30 ] || fail "etcd startup timed out."
          sleep 1
        done
        if [ "$$auth" = yes ]; then
          export ETCDCTL_USER="$$ETCD_ROOT_USER" ETCDCTL_PASSWORD="$$ETCD_ROOT_PASSWORD"
        fi
        status=$$(etcdctl auth status) || fail "Cannot verify authentication; check configured credentials."
        case "$$status" in
        *"Authentication Status: false"*)
          if [ "$$auth" = yes ]; then
            users=$$(etcdctl user list)
            [ -z "$$users" ] || fail "Existing users with disabled authentication require manual review."
            printf "%s\n%s\n" "$$ETCD_ROOT_PASSWORD" "$$ETCD_ROOT_PASSWORD" | etcdctl user add root >/dev/null
            printf "%s\n%s\n" "$$ETCD_PASSWORD" "$$ETCD_PASSWORD" | etcdctl user add "$$ETCD_USERNAME" >/dev/null
            etcdctl role add openim-role
            etcdctl role grant-permission openim-role --prefix readwrite ""
            etcdctl user grant-role "$$ETCD_USERNAME" openim-role
            etcdctl user grant-role root root
            etcdctl auth enable
          else
            echo "etcd authentication is explicitly disabled; restrict access to the published ports."
          fi
          ;;
        *"Authentication Status: true"*)
          [ "$$auth" = yes ] || fail "Existing authentication requires configured credentials."
          ;;
        *) fail "Could not determine authentication status." ;;
        esac
        if [ "$$auth" = yes ]; then
          etcdctl user get root >/dev/null
          ETCDCTL_USER="$$ETCD_USERNAME" ETCDCTL_PASSWORD="$$ETCD_PASSWORD" etcdctl get /check_openim_component >/dev/null
        fi
        echo "etcd startup complete."
        wait "$$daemon"
    restart: always
    networks:
      - openim

  kafka:
    image: "${KAFKA_IMAGE}"
    container_name: kafka
    user: root
    restart: always
    volumes:
      - "${DATA_DIR}/components/kafka:/bitnami/kafka"
    environment:
      #KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
      TZ: Asia/Shanghai
      # Unique identifier for the Kafka node (required in controller mode)
      KAFKA_CFG_NODE_ID: 0
      # Defines the roles this Kafka node plays: broker, controller, or both
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      # Specifies which nodes are controller nodes for quorum voting.
      # The syntax follows the KRaft mode (no ZooKeeper): node.id@host:port
      # The controller listener endpoint here is kafka:9093
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      # Specifies which listener is used for controller-to-controller communication
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Default number of partitions for new topics
      KAFKA_NUM_PARTITIONS: 8
      # Whether to enable automatic topic creation
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Kafka internal listeners; Kafka supports multiple ports with different protocols
      # Each port is used for a specific purpose: INTERNAL for internal broker communication,
      # CONTROLLER for controller communication, EXTERNAL for external client connections.
      # These logical listener names are mapped to actual protocols via KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
      # In short, Kafka is listening on three logical ports: 9092 for internal communication,
      # 9093 for controller traffic, and 9094 for external access.
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      # Addresses advertised to clients. INTERNAL://kafka:9092 uses the internal Docker service name 'kafka',
      # so other containers can access Kafka via kafka:9092.
      # EXTERNAL://localhost:19094 is the address external clients (e.g., in the LAN) should use to connect.
      # If Kafka is deployed on a different machine than IM, 'localhost'(or 'kafka') should be replaced with the LAN IP.
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://kafka:9094"
      # Maps logical listener names to actual protocols.
      # Supported protocols include: PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"
      # Defines which listener is used for inter-broker communication within the Kafka cluster
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # Authentication configuration variables - comment out to disable auth
      # KAFKA_USERNAME: "openIM"
      # KAFKA_PASSWORD: "<CHANGE_ME_FROM_ENV>"
    command: >
      /bin/sh -c '
        if [ -n "$${KAFKA_USERNAME}" ] && [ -n "$${KAFKA_PASSWORD}" ]; then
          echo "=== Kafka SASL Authentication ENABLED ==="
          echo "Username: $${KAFKA_USERNAME}"
          
          # Set environment variables for SASL authentication
          export KAFKA_CFG_LISTENERS="SASL_PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
          export KAFKA_CFG_ADVERTISED_LISTENERS="SASL_PLAINTEXT://kafka:9092,EXTERNAL://kafka:9094"
          export KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP="CONTROLLER:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT"
          export KAFKA_CFG_SASL_ENABLED_MECHANISMS="PLAIN"
          export KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL="PLAIN"
          export KAFKA_CFG_INTER_BROKER_LISTENER_NAME="SASL_PLAINTEXT"
          export KAFKA_CLIENT_USERS="$${KAFKA_USERNAME}"
          export KAFKA_CLIENT_PASSWORDS="$${KAFKA_PASSWORD}"
        fi
        
        # Start Kafka with the configured environment
        exec /opt/bitnami/scripts/kafka/entrypoint.sh /opt/bitnami/scripts/kafka/run.sh
      '
    networks:
      - openim

  minio:
    image: "${MINIO_IMAGE}"
    ports:
      - "127.0.0.1:${MINIO_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9090"
    container_name: minio
    user: root
    volumes:
      - "${DATA_DIR}/components/mnt/data:/data"
      - "${DATA_DIR}/components/mnt/config:/root/.minio"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY_ID}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_ACCESS_KEY}"
    restart: always
    command: minio server /data --console-address ':9090'
    networks:
      - openim

  openim-web-front:
    image: ${OPENIM_WEB_FRONT_IMAGE}
    container_name: openim-web-front
    restart: always
    ports:
      - "127.0.0.1:${OPENIM_WEB_FRONT_PORT}:80"
    networks:
      - openim

  openim-admin-front:
     image: ${OPENIM_ADMIN_FRONT_IMAGE}
     container_name: openim-admin-front
     restart: always
     ports:
       - "127.0.0.1:${OPENIM_ADMIN_FRONT_PORT}:80"
     networks:
       - openim

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: prometheus
    restart: always
    user: root
    profiles:
      - m
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/instance-down-rules.yml:/etc/prometheus/instance-down-rules.yml
      - ${DATA_DIR}/components/prometheus/data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=:${PROMETHEUS_PORT}"
    network_mode: host

  alertmanager:
    image: ${ALERTMANAGER_IMAGE}
    container_name: alertmanager
    restart: always
    profiles:
      - m
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./config/email.tmpl:/etc/alertmanager/email.tmpl
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.listen-address=:${ALERTMANAGER_PORT}"
    network_mode: host

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: grafana
    user: root
    restart: always
    profiles:
      - m
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SESSION_COOKIE_SAMESITE=none
      - GF_SESSION_COOKIE_SECURE=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SERVER_HTTP_PORT=${GRAFANA_PORT}
    volumes:
      - ${DATA_DIR:-./}/components/grafana:/var/lib/grafana
    network_mode: host

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    container_name: node-exporter
    restart: always
    profiles:
      - m
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--web.listen-address=:${NODE_EXPORTER_PORT}"
    network_mode: host

  openim-server:
    image: ${OPENIM_SERVER_IMAGE}
    container_name: openim-server
    init: true
    ports:
      - "127.0.0.1:${OPENIM_MSG_GATEWAY_PORT}:10001"
      - "127.0.0.1:${OPENIM_API_PORT}:10002"
    healthcheck:
      test: ["CMD", "sh", "-c", "./mage check"]
      interval: 5s
      timeout: 60s
      retries: 10
      start_period: 5m
    environment:
      - IMENV_MONGODB_ADDRESS=${MONGO_ADDRESS}
      - IMENV_MONGODB_USERNAME=${MONGO_USERNAME}
      - IMENV_MONGODB_PASSWORD=${MONGO_PASSWORD}
      - IMENV_KAFKA_ADDRESS=${KAFKA_ADDRESS}
      - IMENV_KAFKA_USERNAME=${KAFKA_USERNAME}
      - IMENV_KAFKA_PASSWORD=${KAFKA_PASSWORD}
      - IMENV_DISCOVERY_ETCD_ADDRESS=${ETCD_ADDRESS}
      - IMENV_REDIS_ADDRESS=${REDIS_ADDRESS}
      - IMENV_REDIS_PASSWORD=${REDIS_PASSWORD}
      - IMENV_DISCOVERY_ETCD_USERNAME=${ETCD_USERNAME}
      - IMENV_DISCOVERY_ETCD_PASSWORD=${ETCD_PASSWORD}
      - IMENV_MINIO_INTERNALADDRESS=${MINIO_INTERNAL_ADDRESS}
      - IMENV_MINIO_EXTERNALADDRESS=${MINIO_EXTERNAL_ADDRESS}
      - IMENV_MINIO_ACCESSKEYID=${MINIO_ACCESS_KEY_ID}
      - IMENV_MINIO_SECRETACCESSKEY=${MINIO_SECRET_ACCESS_KEY}
      - IMENV_SHARE_SECRET=${OPENIM_SECRET}
      - IMENV_LOG_ISSTDOUT=${LOG_IS_STDOUT}
      - IMENV_LOG_REMAINLOGLEVEL=${LOG_LEVEL}
      - IMENV_OPENIM_API_PROMETHEUS_GRAFANAURL=${GRAFANA_URL}
    restart: always
    depends_on:
      - mongo
      - redis
      - etcd
      - kafka
      - minio
    networks:
      - openim

  openim-chat:
    image: ${OPENIM_CHAT_IMAGE}
    container_name: openim-chat
    init: true
    healthcheck:
      test: ["CMD", "sh", "-c", "./mage check"]
      interval: 5s
      timeout: 60s
      retries: 10
    environment:
      - CHATENV_MONGODB_ADDRESS=${MONGO_ADDRESS}
      - CHATENV_MONGODB_USERNAME=${MONGO_USERNAME}
      - CHATENV_MONGODB_PASSWORD=${MONGO_PASSWORD}
      - CHATENV_DISCOVERY_ETCD_ADDRESS=${ETCD_ADDRESS}
      - CHATENV_REDIS_ADDRESS=${REDIS_ADDRESS}
      - CHATENV_REDIS_PASSWORD=${REDIS_PASSWORD}
      - CHATENV_SHARE_OPENIM_SECRET=${OPENIM_SECRET}
      - CHATENV_DISCOVERY_ETCD_USERNAME=${ETCD_USERNAME}
      - CHATENV_DISCOVERY_ETCD_PASSWORD=${ETCD_PASSWORD}
      - CHATENV_SHARE_OPENIM_APIURL=${API_URL}
      - CHATENV_LOG_ISSTDOUT=${LOG_IS_STDOUT}
      - CHATENV_LOG_REMAINLOGLEVEL=${LOG_LEVEL}
      # 语音/视频通话：覆盖 chat-rpc-chat.yml 里的 liveKit.url
      - CHATENV_CHAT_RPC_CHAT_LIVEKIT_URL=${LIVEKIT_URL}
    ports:
      - "127.0.0.1:${CHAT_API_PORT}:10008"
      - "127.0.0.1:${ADMIN_API_PORT}:10009"
    restart: always
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      etcd:
        condition: service_started
      kafka:
        condition: service_started
      minio:
        condition: service_started
      openim-server:
        condition: service_healthy
    networks:
      - openim

  # 语音/视频通话媒体服务器（LiveKit SFU）
  livekit:
    image: ${LIVEKIT_IMAGE}
    container_name: livekit
    restart: always
    command: --config /etc/livekit.yaml
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"                    # HTTP / WebSocket 信令端口
      - "7881:7881"                    # WebRTC over TCP 回退
      - "7882:7882/udp"                # WebRTC 媒体流（UDP）
    networks:
      - openim

  # OA 业务服务（拍照打卡、工作报告 · 两级审阅等）
  # 代码在 src/xinbo-oa，构建：cd src/xinbo-oa && docker build -t xinbo-oa:local .
  # 注意：OA_TOKEN_SECRET 必须与 chat 的 config/chat-rpc-admin.yml 里 secret 一致，
  #       因为 chatToken 是用它签发的（不是 share.yml 的 openIM.secret）。
  xinbo-oa:
    image: ${XINBO_OA_IMAGE:-xinbo-oa:local}
    container_name: xinbo-oa
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - OA_PORT=10010
      - OA_MONGO_URI=${XINBO_OA_MONGO_URI}
      - OA_MONGO_DB=${XINBO_OA_MONGO_DB}
      - OA_TOKEN_SECRET=${XINBO_OA_TOKEN_SECRET}
      - OA_COMPANY_ID=${XINBO_OA_COMPANY_ID}
      # 附件与打卡照片复用 IM 的 MinIO，单独建 oa 桶，不碰 openim 的桶
      - OA_MINIO_ENDPOINT=${XINBO_OA_MINIO_ENDPOINT:-minio:9000}
      - OA_MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY_ID}
      - OA_MINIO_SECRET_KEY=${MINIO_SECRET_ACCESS_KEY}
      - OA_MINIO_BUCKET=${XINBO_OA_MINIO_BUCKET:-xinbo-oa}
      - OA_FILE_MAX_MB=${XINBO_OA_FILE_MAX_MB:-20}
      # 打卡定位：默认不设打卡点（只记录真实坐标、不判范围）；
      # 需要考勤范围时在 .env 填 XINBO_OA_OFFICE_* 后重建容器
      - OA_OFFICE_LAT=${XINBO_OA_OFFICE_LAT:-}
      - OA_OFFICE_LNG=${XINBO_OA_OFFICE_LNG:-}
      - OA_OFFICE_NAME=${XINBO_OA_OFFICE_NAME:-}
      - OA_OFFICE_ADDRESS=${XINBO_OA_OFFICE_ADDRESS:-}
      - OA_OFFICE_RADIUS=${XINBO_OA_OFFICE_RADIUS:-500}
      - OA_CHECKIN_STRICT_FENCE=${XINBO_OA_STRICT_FENCE:-false}
      # 逆地理编码用的腾讯位置服务 key，只留在服务端
      - OA_MAP_KEY=${XINBO_OA_MAP_KEY:-}
      # 作息规则：上班时间之后打上班卡算迟到，下班时间之前打下班卡算早退
      # 默认 09:05 上班、18:00 下班；换班次只改这里，不用改代码
      - OA_WORK_ON_TIME=${XINBO_OA_WORK_ON_TIME:-09:05}
      - OA_WORK_OFF_TIME=${XINBO_OA_WORK_OFF_TIME:-18:00}
      - OA_WORK_LATE_GRACE_MIN=${XINBO_OA_LATE_GRACE_MIN:-0}
    ports:
      - "127.0.0.1:${XINBO_OA_PORT}:10010"
    depends_on:
      mongo:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - openim
