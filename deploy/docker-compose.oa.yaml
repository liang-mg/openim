# ============================================================
# OA 服务 compose override（叠加到官方 openim-docker 的 docker-compose.yaml）
#
# 用法（由 deploy.sh 调用，在 oa-custom 根目录执行）：
#   docker compose -f base/docker-compose.yaml \
#                  -f deploy/docker-compose.oa.yaml \
#                  up -d --build xinbo-oa oa-web
#
# 设计要点：
#   1. 只定义 OA 服务，不改官方任何服务，底座升级只需替换 base/ 下文件；
#   2. 网络 openim 复用官方 compose 里定义的同名网络（不在这里重复声明）；
#   3. mongo/minio 依赖官方服务已起，depends_on 只做启动顺序保证；
#   4. build context 相对第一个 compose 文件（base/）解析，故用 ../backend ../frontend；
#   5. 镜像本地构建，Go 编译内置 Dockerfile，宿主机无需 Go/Node。
# ============================================================
services:
  xinbo-oa:
    image: ${XINBO_OA_IMAGE:-xinbo-oa:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: xinbo-oa
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - OA_PORT=10010
      - OA_MONGO_URI=${XINBO_OA_MONGO_URI}
      - OA_MONGO_DB=${XINBO_OA_MONGO_DB:-openim_v3}
      - OA_TOKEN_SECRET=${XINBO_OA_TOKEN_SECRET}
      - OA_COMPANY_ID=${XINBO_OA_COMPANY_ID:-xinbo}
      - OA_MINIO_ENDPOINT=${XINBO_OA_MINIO_ENDPOINT:-minio:9000}
      - OA_MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY_ID}
      - OA_MINIO_SECRET_KEY=${MINIO_SECRET_ACCESS_KEY}
      - OA_MINIO_BUCKET=${XINBO_OA_MINIO_BUCKET:-xinbo-oa}
      - OA_FILE_MAX_MB=${XINBO_OA_FILE_MAX_MB:-20}
      - OA_OFFICE_LAT=${XINBO_OA_OFFICE_LAT:-}
      - OA_OFFICE_LNG=${XINBO_OA_OFFICE_LNG:-}
      - OA_OFFICE_NAME=${XINBO_OA_OFFICE_NAME:-}
      - OA_OFFICE_ADDRESS=${XINBO_OA_OFFICE_ADDRESS:-}
      - OA_OFFICE_RADIUS=${XINBO_OA_OFFICE_RADIUS:-500}
      - OA_CHECKIN_STRICT_FENCE=${XINBO_OA_STRICT_FENCE:-false}
      - OA_MAP_KEY=${XINBO_OA_MAP_KEY:-}
      - OA_WORK_ON_TIME=${XINBO_OA_WORK_ON_TIME:-09:05}
      - OA_WORK_OFF_TIME=${XINBO_OA_WORK_OFF_TIME:-18:00}
      - OA_WORK_LATE_GRACE_MIN=${XINBO_OA_LATE_GRACE_MIN:-0}
      - OA_WORK_EARLIEST_ON=${XINBO_OA_WORK_EARLIEST_ON:-06:30}
      - OA_MAKEUP_MAX_DAYS=${XINBO_OA_MAKEUP_MAX_DAYS:-7}
      - OA_MAKEUP_MAX_MONTH=${XINBO_OA_MAKEUP_MAX_MONTH:-3}
      - OA_AUTO_SCAN=${XINBO_OA_AUTO_SCAN:-true}
      - OA_IM_PUSH_URL=${XINBO_OA_IM_PUSH_URL:-}
      - OA_IM_PUSH_TOKEN=${XINBO_OA_IM_PUSH_TOKEN:-}
    ports:
      # APK/手机需要从局域网访问；生产环境可在 oa.env 中把 BIND_IP 改为反代服务器地址。
      - "${XINBO_OA_BIND_IP:-0.0.0.0}:${XINBO_OA_PORT:-10010}:10010"
    depends_on:
      mongo:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - openim

  # OA 前端（已含全部 OA 页面的官方 demo），nginx 同源反代 /api /chat /oa 等
  oa-web:
    image: ${XINBO_OA_WEB_IMAGE:-xinbo-oa-web:local}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: oa-web
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "${XINBO_OA_WEB_PORT:-5173}:80"
    depends_on:
      xinbo-oa:
        condition: service_started
    networks:
      - openim
